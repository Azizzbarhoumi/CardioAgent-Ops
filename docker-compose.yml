services:
  mlflow:
    build:
      context: .
      dockerfile: docker/mlflow-server/Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/', timeout=5)"]
      interval: 20s
      timeout: 10s
      start_period: 60s
      retries: 5
    restart: unless-stopped
    networks:
      default:
        aliases:
          - mlflow-server

  audio-engine:
    build:
      context: .
      dockerfile: docker/audio-engine/Dockerfile
    ports:
      - "8000:8000"
    environment:
      MLFLOW_TRACKING_URI: http://mlflow-server:5000
      MLFLOW_PUBLIC_URL: ${MLFLOW_PUBLIC_URL:-http://localhost:5000}
      MLFLOW_SUPPRESS_PRINTING_URL_TO_STDOUT: "true"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      MODEL_DIR: /app/audio_engine/artifacts/models
      MODEL_MANIFEST_PATH: /app/audio_engine/artifacts/models/model_manifest.json
      SVM_LINEAR_MODEL_PATH: /app/audio_engine/artifacts/models/svm_linear.joblib
      SVM_RBF_MODEL_PATH: /app/audio_engine/artifacts/models/svm_rbf.joblib
      DECISION_TREE_MODEL_PATH: /app/audio_engine/artifacts/models/decision_tree.joblib
      CNN_MODEL_PATH: /app/audio_engine/artifacts/models/cnn_custom.keras
      API_MAX_UPLOAD_BYTES: ${API_MAX_UPLOAD_BYTES:-20971520}
      MIN_AUDIO_SECONDS: ${MIN_AUDIO_SECONDS:-0.25}
      MAX_AUDIO_SECONDS: ${MAX_AUDIO_SECONDS:-120}
    volumes:
      - ./audio_engine/artifacts/models:/app/audio_engine/artifacts/models:ro
    depends_on:
      mlflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 180s
      retries: 3
    restart: unless-stopped

  react-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "5173:80"
    depends_on:
      audio-engine:
        condition: service_healthy
    restart: unless-stopped

  streamlit:
    profiles:
      - legacy
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    ports:
      - "8501:8501"
    environment:
      API_URL: http://audio-engine:8000
      MLFLOW_PUBLIC_URL: ${MLFLOW_PUBLIC_URL:-http://localhost:5000}
    depends_on:
      audio-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    restart: unless-stopped

volumes:
  mlflow_data:
    name: mlflow-data
